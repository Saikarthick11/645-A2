<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student survey | SWE 645</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; padding-top: 50px; }
        .form-container { background-color: #0a0a0a; border: 1px solid #1f2937; border-radius: 15px; padding: 40px; margin-bottom: 50px; }
        .form-label { color: #9ca3af; font-weight: 600; }
        .form-control, .form-select { background-color: #111; border: 1px solid #333; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #151515; color: #fff; border-color: #2563eb; box-shadow: none; }
        .btn-submit { background-color: #2563eb; border: none; font-weight: 700; padding: 12px 30px; border-radius: 50px; }
        .btn-cancel { border: 2px solid #333; color: #9ca3af; font-weight: 700; padding: 10px 30px; border-radius: 50px; }
        .btn-cancel:hover { background-color: #1a1a1a; color: #fff; }
    </style>
</head>
<body>
    <div class="text-center mb-5">
                    <a href="index.html" class="text-secondary text-decoration-none">&larr; Back to Home</a>
                </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container">
                    <h1 class="text-center mb-4 fw-bold">Student <span class="text-primary">Survey</span></h1>
                    <p class="text-secondary text-center mb-5">Please fill out the form below to share your campus experience.</p>
                    
                    <form action="#" method="post">
                        <!-- Required Text Fields -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">First Name*</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name*</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Street Address*</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">City*</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">State*</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Zip*</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telephone Number*</label>
                                <input type="tel" class="form-control" placeholder="(000) 000-0000" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">E-mail*</label>
                                <input type="email" class="form-control" placeholder="example@gmu.edu" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Date of Survey*</label>
                                <input type="date" class="form-control" required>
                            </div>
                        </div>

                        <!-- Checkboxes -->
                        <div class="mb-4">
                            <label class="form-label d-block mb-3">What did you like most about the campus?</label>
                            <div class="row">
                                <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="liked" value="students"><label class="form-check-label">Students</label></div></div>
                                <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="liked" value="location"><label class="form-check-label">Location</label></div></div>
                                <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="liked" value="campus"><label class="form-check-label">Campus</label></div></div>
                                <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="liked" value="atmosphere"><label class="form-check-label">Atmosphere</label></div></div>
                                <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="liked" value="dorm"><label class="form-check-label">Dorm Rooms</label></div></div>
                                <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" name="liked" value="sports"><label class="form-check-label">Sports</label></div></div>
                            </div>
                        </div>

                        <!-- Radio Buttons -->
                        <div class="mb-4">
                            <label class="form-label d-block mb-3">How did you become interested in the university?</label>
                            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="interest" value="friends"><label class="form-check-label">Friends</label></div>
                            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="interest" value="tv"><label class="form-check-label">Television</label></div>
                            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="interest" value="internet"><label class="form-check-label">Internet</label></div>
                            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="interest" value="other"><label class="form-check-label">Other</label></div>
                        </div>

                        <!-- Dropdown -->
                        <div class="mb-4">
                            <label class="form-label">Likelihood of recommending this school?</label>
                            <select class="form-select">
                                <option value="Very Likely">Very Likely</option>
                                <option value="Likely">Likely</option>
                                <option value="Unlikely">Unlikely</option>
                            </select>
                        </div>

                        <!-- Raffle -->
                        <div class="mb-4">
                            <label class="form-label">Raffle (Enter at least 10 comma separated numbers 1-100)</label>
                            <input type="text" class="form-control" placeholder="10, 25, 4, 88...">
                        </div>

                        <!-- Comments -->
                        <div class="mb-5">
                            <label class="form-label">Additional Comments</label>
                            <textarea class="form-control" rows="4"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-3">
                            <button type="reset" class="btn btn-cancel">Cancel</button>
                            <button type="submit" class="btn btn-blue text-white btn-submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
